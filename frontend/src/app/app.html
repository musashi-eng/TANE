<ui-app-shell [showFooter]="true">
  <!-- ヘッダースロット -->
  <ui-app-header
    appShellHeader
    [appName]="title() + ' デザインシステム'"
    appSubtitle="Showcase"
    logoLink="/">
    <span appHeaderLogo class="ds-brand__mark" aria-hidden="true"></span>

    <!-- ページナビ -->
    @for (item of navItems; track item.path) {
      <a
        appHeaderNav
        [routerLink]="item.path"
        routerLinkActive="ds-nav--active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        class="ds-nav">
        {{ item.label }}
      </a>
    }
  </ui-app-header>

  <!-- メインコンテンツ（各ページを router-outlet で切替） -->
  <router-outlet />

  <!-- フッタースロット -->
  <div appShellFooter class="ds-footer">
    <span>{{ title() }} — &#64;musashi-eng/design-system ショーケース</span>
  </div>
</ui-app-shell>

<!-- トーストの表示先（アプリ全体で1つ） -->
<ui-toast-container />
